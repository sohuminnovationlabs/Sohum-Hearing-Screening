const api = {
  get: async (params) => {
    const url = SCRIPT_URL + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url);
    return res.json();
  },
  post: async (body) => {
    await fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return { status: 'success' };
  },
  postReadable: async (body) => {
    const res = await fetch(SCRIPT_URL + '?action=' + body.action, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(body)
    });
    return res.json();
  }
};

// ─────────────────────────────────────────────
// HELPER: parse attempt photos from Unique ID + ear + attempt
// e.g. uniqueId=abc123, ear=L, maxAttempts=3 → [abc123L01, abc123L02, abc123L03]
// ─────────────────────────────────────────────
const getPhotoNames = (uniqueId, ear, result, globalOffset = 0) => {
  if (!uniqueId || !result) return [];
  const clean = result.replace(/^AO\[/, '[').replace(/^AO/, '');
  let attempts = [];
  if (clean.startsWith('[')) {
    const inner = clean.replace(/^\[/, '').replace(/\]$/, '');
    attempts = inner.split(',').map(s => s.trim());
  } else if (clean) {
    attempts = [clean];
  }
  const photos = [];
  attempts.forEach((res, idx) => {
    if (res === 'REFER' || res === 'REDO') {
      const globalNum = globalOffset + idx + 1;
      const num = String(globalNum).padStart(2, '0');
      photos.push({ filename: `${uniqueId}${ear}${num}`, result: res, attemptNum: globalNum });
    }
  });
  return photos;
};

      { key: 'rightEar70DB', ear: 'R', db: '70dB' },
      { key: 'rightEar90DB', ear: 'R', db: '90dB' }
    ];
    const earOffsets = { L: 0, R: 0 };
    dbCols.forEach(({ key, ear, db }) => {
      const result = detail[key] || '';
      const clean = result.replace(/^AO\[/, '[').replace(/^AO/, '');
      let attemptCount = 0;
      if (clean.startsWith('[')) {
        attemptCount = clean.replace(/^\[/, '').replace(/\]$/, '').split(',').length;
      } else if (clean) {
        attemptCount = 1;

      if (result) {

      }

        action: 'requestPhoto',

    React.createElement('div', { className: 'w-8 h-8 border-2 border-primary border-t-transparent rounded-full spin' }),
    React.createElement('p', { className: 'text-sm text-gray-400' }, t('loading'))
  );

  return React.createElement('div', { className: 'min-h-screen flex flex-col pb-52' },
    React.createElement(Header, {
      title: t('reviewCase'),
      subtitle: detail?.babyName || queueItem.babyName || '—',

    // Urgency + status badges

      isUrgent && React.createElement(Pill, { label: '🚨 ' + t('urgent'), color: 'orange' }),
      React.createElement(Pill, {
        label: queueItem.reviewStatus === 'photo_received' ? '📷 ' + t('photoReceived') :
               queueItem.reviewStatus === 'photo_requested' ? t('photoRequested') : t('pending'),
        color: queueItem.reviewStatus === 'photo_received' ? 'green' :

        React.createElement('button', {

     // PHOTOS TAB — left ear photos + left verdict, then right ear photos + right verdict

            };

    setLoading(true);

      const res = await api.get({ action: 'getAdminOverview' });
      if (res.status === 'success') {
        setData(res.data);
        setAudiologists(Object.keys(res.data));

    setLoading(false);

      action: 'reassignCase',
      screeningId: reassignModal.screeningId,
      newAudiologist: newAssignee,
      adminUsername: user.username

    setReassignModal(null);
    setNewAssignee('');

                  React.createElement('p', { className: 'font-semibold text-gray-800 text-sm' }, username),

                      React.createElement('div', { className: 'flex-1 min-w-0' },

                      }, t('reassign'))
                    )

    // Reassign modal

        },
          React.createElement('option', { value: '' }, t('selectAudiologist')),

          }, t('confirm'))
        )

};

// ─────────────────────────────────────────────
const SCREEN = {
  LOGIN: 'LOGIN',
  QUEUE: 'QUEUE',
  REVIEW: 'REVIEW',
  STATS: 'STATS',
  ADMIN: 'ADMIN'
};

const App = () => {
  const [lang, setLang] = useState('en');
  const t = key => T[lang][key] || key;
  const [screen, setScreen] = useState(SCREEN.LOGIN);
  const [user, setUser] = useState(null);
  const [selectedItem, setSelectedItem] = useState(null);

  const handleLogin = (userData) => {
    setUser(userData);
    setScreen(userData.role === 'admin' ? SCREEN.ADMIN : SCREEN.QUEUE);
  };

  const handleLogout = () => { setUser(null); setScreen(SCREEN.LOGIN); };

  return React.createElement(LangCtx.Provider, { value: { lang, setLang, t } },
    React.createElement('div', {},
      screen === SCREEN.LOGIN && React.createElement(LoginScreen, { onLogin: handleLogin }),
      screen === SCREEN.QUEUE && React.createElement(QueueScreen, {
        user,
        onReview: item => { setSelectedItem(item); setScreen(SCREEN.REVIEW); },
        onStats: () => setScreen(SCREEN.STATS),
        onLogout: handleLogout
      }),
      screen === SCREEN.REVIEW && React.createElement(ReviewScreen, {
        user,
        queueItem: selectedItem,
        onBack: () => setScreen(SCREEN.QUEUE),
        onSubmitted: () => setScreen(SCREEN.QUEUE)
      }),
      screen === SCREEN.STATS && React.createElement(StatsScreen, {
        user,
        onBack: () => setScreen(SCREEN.QUEUE)
      }),
      screen === SCREEN.ADMIN && React.createElement(AdminOverviewScreen, {
        user,
        onLogout: handleLogout
      })
    )
  );
};

createRoot(document.getElementById('root')).render(React.createElement(App));
