// GPS Location with Smart Caching
let lastLocation = null;
let lastLocationTime = null;

const getSmartLocation = () => {
  return new Promise((resolve) => {
    const now = Date.now();
    const CACHE_DURATION = 15 * 60 * 1000; // 15 minutes
    
    // Use cached location if recent
    if (lastLocation && lastLocationTime && (now - lastLocationTime) < CACHE_DURATION) {
      resolve(lastLocation);
      return;
    }
    
    // Try to get new location
    if (!navigator.geolocation) {
      resolve({ latitude: '', longitude: '', accuracy: 'Not available' });
      return;
    }
    
    navigator.geolocation.getCurrentPosition(
      (position) => {
        lastLocation = {
          latitude: position.coords.latitude.toFixed(6),
          longitude: position.coords.longitude.toFixed(6),
          accuracy: position.coords.accuracy ? `${Math.round(position.coords.accuracy)}m` : 'Unknown'
        };
        lastLocationTime = now;
        resolve(lastLocation);
      },
      (error) => {
        // If error, use last known location or empty
        resolve(lastLocation || { latitude: '', longitude: '', accuracy: 'Permission denied' });
      },
      {
        timeout: 5000,
        maximumAge: 60000, // Accept 1-min-old location from device
        enableHighAccuracy: false // Use network location (WiFi/cell), not GPS
      }
    );
  });
};
const SOHUM_NGO_NAME        = 'Sohum Innovation Lab';

const fetchMasterData = async () => {
  try {
    const baseUrl = `https://docs.google.com/spreadsheets/d/${MASTER_SHEET_ID}/gviz/tq?tqx=out:json`;
    const [hwRes, hospRes, devRes] = await Promise.all([
      fetch(`${baseUrl}&gid=1307397658`),
      fetch(`${baseUrl}&gid=1533063125`),
      fetch(`${baseUrl}&gid=1397829803`)
    ]);
    const parse = async (r) => {
      const text = await r.text();
      const json = JSON.parse(text.substring(47).slice(0, -2));
      return json.table.rows.map(row => row.c.map(cell => cell ? cell.v : ''));
    };
    const [hwData, hospData, devData] = await Promise.all([parse(hwRes), parse(hospRes), parse(devRes)]);
    return { healthcareWorkers: hwData.slice(1), hospitals: hospData.slice(1), devices: devData.slice(1) };
  } catch (error) {
    console.error('Error fetching master data:', error);
    throw error;
  }
};

const fetchSohumAssignments = async (username) => {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${MASTER_SHEET_ID}/gviz/tq?tqx=out:json&gid=${SOHUM_ASSIGNMENTS_GID}`;
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(47).slice(0, -2));
    const rows = json.table.rows.map(row => row.c.map(cell => cell ? cell.v : ''));
    const match = rows.find(r => r[0] && r[0].toString().trim() === username);
    if (!match) return null;
    const hospitals = (match[1] || '').toString().split(',').map(s => s.trim()).filter(Boolean);
    const devices   = (match[2] || '').toString().split(',').map(s => s.trim()).filter(Boolean);
    return { hospitals, devices };
  } catch (e) {
    console.warn('fetchSohumAssignments failed:', e);
    return null;
  }
};

    return [];

// Enhanced Stats Calculation
const calculateDetailedStats = (logData, operatorId) => {
  const dataRows = logData.slice(1); // Skip header row
  const userScreenings = dataRows.filter(row => row[2] === operatorId);
  if (userScreenings.length === 0) {
    return { today: 0, thisWeek: 0, thisMonth: 0, last30Days: 0, allTime: 0, dailyAvg: 0, bestDay: null, aabrCount: 0, oaeCount: 0 };
  }
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const weekStart = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const thirtyDaysAgo = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  const today = userScreenings.filter(row => new Date(row[0]) >= todayStart).length;
  const thisWeek = userScreenings.filter(row => new Date(row[0]) >= weekStart).length;
  const thisMonth = userScreenings.filter(row => new Date(row[0]) >= monthStart).length;
  const last30Days = userScreenings.filter(row => new Date(row[0]) >= thirtyDaysAgo).length;
  const allTime = userScreenings.length;
  const daysIntoMonth = now.getDate();
  const dailyAvg = daysIntoMonth > 0 ? (thisMonth / daysIntoMonth).toFixed(1) : 0;
  const dayGroups = {};
  userScreenings.forEach(row => {
    const dateStr = new Date(row[0]).toISOString().split('T')[0];
    dayGroups[dateStr] = (dayGroups[dateStr] || 0) + 1;
  });
  const bestDayEntry = Object.entries(dayGroups).sort((a, b) => b[1] - a[1])[0];
  const bestDay = bestDayEntry ? { count: bestDayEntry[1], date: new Date(bestDayEntry[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) } : null;
  const thisMonthScreenings = userScreenings.filter(row => new Date(row[0]) >= monthStart);
  const aabrCount = thisMonthScreenings.filter(row => row[17] === 'AABR').length;
  const oaeCount = thisMonthScreenings.filter(row => row[17] === 'OAE').length;
  return { today, thisWeek, thisMonth, last30Days, allTime, dailyAvg: parseFloat(dailyAvg), bestDay, aabrCount, oaeCount };
};

      setLoading(true);
      try {

        const data = await res.json();
        setAppointments(data.status === 'success' ? (data.data || []) : []);
      } catch { setAppointments([]); }
      setLoading(false);
    };
    load();
  }, [user.hwId]);

  const todayStr = (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  })();

  const fmt12 = (t) => {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
  };
  const fmtDate = (s) => {
    if (!s) return '';
    const [y, mo, d] = s.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${parseInt(d)} ${months[parseInt(mo)-1]} ${y}`;
  };

  const statusStyle = (s) => {
    if (s === 'booked')      return 'bg-blue-50 text-blue-700';
    if (s === 'completed')   return 'bg-green-50 text-green-700';
    if (s === 'rescheduled') return 'bg-yellow-50 text-yellow-700';
    if (s === 'no_show')     return 'bg-red-50 text-red-700';
    return 'bg-gray-100 text-gray-500';
  };
  const statusLabel = (s) => ({ booked:'Confirmed', completed:'Completed', rescheduled:'Rescheduled', no_show:'No Show', cancelled:'Cancelled' }[s] || s);

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const filtered = appointments.filter(a => {
    const d = new Date(a.appointmentDate + 'T00:00:00');
    if (filter === 'today')    return a.appointmentDate === todayStr;
    if (filter === 'upcoming') return d > today;
    return d < today || a.status === 'completed' || a.status === 'no_show';
  });

  const canMarkNoShow = (a) => {
    if (!a.babyName || !a.babyName.trim()) return false;
    if (a.status !== 'booked' && a.status !== 'rescheduled') return false;
    const [y,mo,d] = a.appointmentDate.split('-').map(Number);
    const [h,m] = a.appointmentTime.split(':').map(Number);
    const unlock = new Date(y, mo-1, d, h, m).getTime() + 30 * 60000;
    return Date.now() >= unlock;
  };

  const noShowUnlockTime = (a) => {
    const [y,mo,d] = a.appointmentDate.split('-').map(Number);
    const [h,m] = a.appointmentTime.split(':').map(Number);
    const t = new Date(y, mo-1, d, h, m).getTime() + 30 * 60000;

    setNoShowLoading(null);
  };

  return React.createElement('div', { className: 'min-h-screen flex flex-col' },
    toast && React.createElement('div', {
      className: `fixed top-4 left-1/2 -translate-x-1/2 z-50 max-w-[420px] w-[92%] rounded-2xl shadow-xl px-5 py-4 flex items-center gap-3 ${toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'} text-white`
    },
      React.createElement('span', {}, toast.type === 'success' ? '✓' : '✕'),
      React.createElement('p', { className: 'flex-1 text-sm font-medium' }, toast.msg),
      React.createElement('button', { onClick: () => setToast(null), className: 'text-white/70 hover:text-white' }, '×')
    ),
    React.createElement(Header, { title: 'My Appointments', subtitle: 'Scheduled screenings', onBack, user, onProfileClick, onNotificationsClick, notificationCount }),
    React.createElement(Container, {},
      React.createElement('div', { className: 'flex gap-2 mb-5 bg-secondary rounded-xl p-1' },
        [['today','Today'],['upcoming','Upcoming'],['past','Past']].map(([val, label]) =>
          React.createElement('button', {
            key: val,
            onClick: () => setFilter(val),
            className: `flex-1 py-2 text-sm font-medium rounded-lg transition-all ${filter === val ? 'bg-white text-primary shadow-sm' : 'text-gray-500'}`
          }, label)
        )
      ),
      loading
        ? React.createElement('div', { className: 'text-center py-12 text-gray-400 text-sm' }, 'Loading appointments…')
        : filtered.length === 0
          ? React.createElement('div', { className: 'text-center py-12' },
              React.createElement('p', { className: 'text-3xl mb-3' }, '📅'),
              React.createElement('p', { className: 'text-gray-500 text-sm' }, `No ${filter} appointments.`)
            )
          : React.createElement('div', { className: 'space-y-3' },
              filtered.map(a =>
                React.createElement(Card, { key: a.appointmentId },
                  React.createElement('div', { className: 'flex items-start justify-between gap-2 mb-3' },
                    React.createElement('div', {},
                      React.createElement('p', { className: 'font-semibold text-gray-800' }, a.babyName || 'Walk-in Slot'),
                      React.createElement('p', { className: 'text-xs text-gray-400 mt-0.5' }, a.appointmentId)
                    ),
                    React.createElement('span', { className: `text-xs font-medium px-2.5 py-1 rounded-full ${statusStyle(a.status)}` }, statusLabel(a.status))
                  ),
                  React.createElement('div', { className: 'grid grid-cols-2 gap-2 mb-3' },
                    [

const NotificationsScreen = ({ user, onBack, onProfileClick, onNotificationsClick, notificationCount }) => {

  const [loading, setLoading] = useState(true);
  const [selectedNotif, setSelectedNotif] = useState(null);
  const [uploading, setUploading] = useState({});
  const [submitted, setSubmitted] = useState(() => {
    try { return JSON.parse(localStorage.getItem('sohum_retake_submitted') || '{}'); } catch(e) { return {}; }
  });
  const [activeTab, setActiveTab] = useState('retake');

  const load = async () => {
    setLoading(true);
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getHCWNotifications&hwId=${user.hwId}`);
      const data = await res.json();
      setNotifications(data.data || []);
    } catch (e) { console.error(e); }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const handleCameraCapture = async (notif, file) => {
    if (!file) return;
    const sid = notif.screeningId || notif.screeningID || '';
    setUploading(prev => ({ ...prev, [sid]: true }));
    try {
      const { base64 } = await compressPhoto(file);
      const synopsisMatch = (notif.synopsis || '').match(/Filename requested: ([^\n]+)/);
      const originalFilename = synopsisMatch ? synopsisMatch[1].trim() : (notif.uniqueId || notif.uniqueID || '') + 'RETAKE';
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'submitFlaggedPhoto',
          base64Data: base64,
          filename: originalFilename
        })
      });
      const json = await res.json();
      if (json.status === 'success') {
        const newSubmitted = { ...submitted, [sid]: true };
        setSubmitted(newSubmitted);
        try { localStorage.setItem('sohum_retake_submitted', JSON.stringify(newSubmitted)); } catch(e) {}
        load();
      } else {
        console.error('submitFlaggedPhoto error:', json.message);
        alert('Upload failed: ' + (json.message || 'Unknown error'));
      }
    } catch (e) {
      console.error('handleCameraCapture error:', e);
      alert('Upload failed. Please try again.');
    } finally {
      setUploading(prev => ({ ...prev, [sid]: false }));
    }

    { id: 'retake', label: '📷 Retake', filter: n => n.reviewStatus === 'photo_requested' },

      ? React.createElement('div', { className: 'flex items-center justify-center py-20 text-gray-400' }, t('loading'))
      : filtered.length === 0
        ? React.createElement('div', { className: 'flex flex-col items-center justify-center py-20 text-gray-400' },

// Main App
const STEP = { LOADING: 'LOADING', LOGIN: 'LOGIN', SESSION: 'SESSION', MENU: 'MENU', BABY: 'BABY', EXISTING_BABY: 'EXISTING_BABY', TEST_SELECT: 'TEST_SELECT', AABR: 'AABR', OAE_TYPE: 'OAE_TYPE', OAE_PROTOCOL: 'OAE_PROTOCOL', OAE: 'OAE', REC: 'REC', SUCCESS: 'SUCCESS', NOTIFICATIONS: 'NOTIFICATIONS', APPOINTMENTS: 'APPOINTMENTS' };
const compressPhoto = (file) => {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('File read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image load failed'));
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width;
        let h = img.height;

        // Only resize if dimensions exceed the cap
        if (w > PHOTO_MAX_WIDTH || h > PHOTO_MAX_HEIGHT) {
          const ratio = Math.min(PHOTO_MAX_WIDTH / w, PHOTO_MAX_HEIGHT / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }

        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);

        {
          const imageData = ctx.getImageData(0, 0, w, h);
          const pixels = imageData.data;
          for (let i = 0; i < pixels.length; i += 4) {
            const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
            if (PHOTO_GRAYSCALE) {
              // Full greyscale
              const grey = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
              pixels[i] = grey; pixels[i + 1] = grey; pixels[i + 2] = grey;
            } else {
              // Chromatic-preserving: boost waveform colours, greyscale everything else
              const isRedDominant   = r > 120 && r > g * 1.2 && r > b * 1.2;
              const isGreenDominant = g > 120 && g > r * 1.2 && g > b * 1.2;
              const isBlueDominant  = b > 120 && b > r * 1.2 && b > g * 1.2;
              if (isRedDominant)        { pixels[i] = 220; pixels[i+1] = 50;  pixels[i+2] = 50;  }
              else if (isGreenDominant) { pixels[i] = 50;  pixels[i+1] = 200; pixels[i+2] = 50;  }
              else if (isBlueDominant)  { pixels[i] = 50;  pixels[i+1] = 50;  pixels[i+2] = 220; }
              else {
                const grey = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                pixels[i] = grey; pixels[i + 1] = grey; pixels[i + 2] = grey;
              }
            }
          }
          ctx.putImageData(imageData, 0, 0);
        }

        // First pass at high quality
        let quality = 0.92;
        let base64 = canvas.toDataURL('image/jpeg', quality).split(',')[1];
        const sizeKB = Math.round(base64.length * 0.75 / 1024);

        // Only compress further if size exceeds target
        if (sizeKB > PHOTO_TARGET_SIZE_KB) {
          // Calculate quality needed to hit target size in one shot
          quality = Math.max(0.4, Math.min(0.92, quality * (PHOTO_TARGET_SIZE_KB / sizeKB)));
          base64 = canvas.toDataURL('image/jpeg', quality).split(',')[1];
          console.log(`Photo compressed: ${sizeKB}KB → ~${Math.round(base64.length * 0.75 / 1024)}KB at quality ${quality.toFixed(2)}`);
        } else {
          console.log(`Photo kept at original quality: ${sizeKB}KB`);
        }

        resolve({ base64, canvas });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

const isImageBlurry = (canvas) => {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const { width, height } = canvas;
  const imageData = ctx.getImageData(0, 0, width, height);
  const pixels = imageData.data;
  const greyPixels = [];
  for (let i = 0; i < pixels.length; i += 4) {
    greyPixels.push(0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2]);
  }
  const mean = greyPixels.reduce((a, b) => a + b, 0) / greyPixels.length;
  const variance = greyPixels.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / greyPixels.length;
  return variance < 100;
};

const uploadAttemptPhoto = async (base64Data, filename, deviceTestId) => {
  if (!base64Data) { console.warn('uploadAttemptPhoto: no base64Data for', filename); return; }
  const MAX_RETRIES = 3;
  const DELAY_MS = 3000;
  const sleep = (ms) => new Promise(res => setTimeout(res, ms));
  const payload = JSON.stringify({ base64Data, filename, deviceTestId });
  console.log('Uploading photo:', filename, 'size:', Math.round(payload.length / 1024) + 'KB');
  for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
    try {
      await fetch(SCRIPT_URL + '?action=uploadPhoto', {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload
      });
      console.log('Photo upload request sent (attempt', attempt, '):', filename);
      return;
    } catch (err) {
      console.warn(`Photo upload attempt ${attempt} failed for ${filename}:`, err);
    }
    if (attempt < MAX_RETRIES) await sleep(DELAY_MS);
  }
  console.error('Photo upload failed after all retries:', filename);
};

const searchBabyRecords = async (searchBy, query) => {
  try {
    const response = await fetch(`${SCRIPT_URL}?action=getAll`);
    const data = await response.json();
    const rows = (data.data || []).slice(1); // skip header row
    const q = query.trim().toLowerCase();

    // Column indices based on sheet structure
    const colMap = {
      babyId: 9,        // J - Baby ID
      uniqueId: 8,      // I - Unique ID
      screeningId: 7,   // H - Screening ID
      phoneNumber: 16   // Q - Parent Phone
    };

    const col = colMap[searchBy];
    if (col === undefined) return null;

    const matches = rows.filter(row => {
      const val = (row[col] || '').toString().trim().toLowerCase();
      return val === q;
    });

    if (matches.length === 0) return null;

    // Sort by timestamp (col 0) descending, take most recent
    matches.sort((a, b) => new Date(b[0]) - new Date(a[0]));
    const row = matches[0];

    // Map row columns back to record fields
    const formatDOB = (val) => {
      if (!val) return '';
      // If already in YYYY-MM-DD format, return as-is
      if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
      const d = new Date(val);
      if (isNaN(d.getTime())) return '';
      // Use local date parts to avoid UTC timezone shift
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };
    return {
      babyId: row[9] || '',
      babyName: row[10] || '',
      dateOfBirth: formatDOB(row[11]),
      gender: row[12] || '',
      gestationalAge: row[13] || '',
      parentName: row[15] || '',
      parentPhone: row[16] || '',
      parentEmail: row[17] || '',
      riskFactors: row[14] ? row[14].split(', ').filter(Boolean) : []
    };
  } catch (error) {
    console.error('searchBabyRecords error:', error);
    return null;
  }
};
