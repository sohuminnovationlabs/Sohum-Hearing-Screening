<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Sohum Admin Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#202B5D' } } }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { margin:0; background:#f1f5f9; min-height:100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #root { width:100%; max-width:520px; background:#f1f5f9; min-height:100vh; margin:0 auto; }
    ::-webkit-scrollbar { width:0; }
    .fade-in { animation: fi 0.25s ease; }
    @keyframes fi { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width:36px; height:36px; border:3px solid #dbeafe; border-top-color:#202B5D; border-radius:50%; animation:spin 0.8s linear infinite; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, createElement: h } = React;
const { createRoot } = ReactDOM;

// ── CONFIG ─────────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzjlCbyObnNHpOj3g3MUnD8o79y0xH8AJeBCxz2SN_uxDGSAA44E1hXBDM2Gf0jHimO/exec';
const CREDS_SHEET_ID = '1w7cKakdDSpAfzNiqHYzjM4qiY_7j14eIBWR4lQlkqDk';
const DASHBOARD_VERSION = '3.2.0';

// ── FALLBACK CREDENTIALS (used if sheet fetch fails) ──────────────────────────
const FALLBACK_USERS = [
  { username:'admin', password:'sil2026', name:'Sohum Admin', role:'admin', ngo:null },
];

// ── DATA ENGINE ────────────────────────────────────────────────────────────────
const VALID_RECS = ['No Action Required','Repeat Screening','Refer for Diagnostic BERA','Refer - Follow-up required','Rescreen in 1 month','Follow Up Required','Refer to audiologist','Pass - No follow-up needed'];
const RF_LIST = ['NICU > 5 days','Family history of hearing loss','Craniofacial anomalies','In utero infections','Hyperbilirubinemia','Syndromes associated with hearing loss'];

const cleanRec = r => {
  if (!r) return null;
  for (const v of VALID_RECS) if (r.toLowerCase().includes(v.toLowerCase())) return v;
  return null;
};

const parseRows = (rawRows, ngoFilter) => rawRows
  .filter(r => r[2] && r[2] !== 'Operator ID' && (!ngoFilter || r[3] === ngoFilter))
  .map(r => ({
    ts: new Date(r[0]), opName: r[1]||'', opId: r[2]||'', ngo: r[3]||'',
    hospital: r[4]||'', device: r[5]||'', babyId: String(r[8]||''),
    gender: r[11]||'', gestAge: Number(r[12])||0, riskFactors: r[13]||'',
    testType: r[17]||'',
    leftEar: [r[21],r[22],r[23],r[24]], rightEar: [r[25],r[26],r[27],r[28]],
    oaeTestType: r[29]||'', oaeLeft: r[31]||'', oaeRight: r[32]||'',
    rec: r[45]||'', cleanRec: cleanRec(r[45]),
    testStart: r[46]||'', submitTime: r[47]||''
  }));

// ── CLASSIFY AABR: lowest valid dB per ear ────────────────────────────────────
// slots order: [35dB, 50dB, 70dB, 90dB] - index 0 is lowest
const earOutcome = slots => {
  // find lowest dB with PASS or REFER (ignore REDO and empty)
  for (let i = 0; i < slots.length; i++) {
    const v = slots[i];
    if (v === 'PASS' || v === 'REFER') return v;
  }
  return null; // not tested or all REDO
};

const classifyAABR = row => {
  const lOut = earOutcome(row.leftEar);
  const rOut = earOutcome(row.rightEar);
  const leftTested  = row.leftEar.some(v  => v === 'PASS' || v === 'REFER' || v === 'REDO');
  const rightTested = row.rightEar.some(v => v === 'PASS' || v === 'REFER' || v === 'REDO');

  if (leftTested && rightTested) {
    if (lOut === 'PASS' && rOut === 'PASS') return 'PASS';
    if (lOut === 'REFER' && rOut === 'REFER') return 'Bilateral Refer';
    if (lOut === 'REFER') return 'Left Ear Refer';
    if (rOut === 'REFER') return 'Right Ear Refer';
    return 'PASS'; // both tested, no refer (e.g. both REDO only - treat as inconclusive below)
  }
  if (leftTested)  return lOut === 'REFER' ? 'Left Ear Refer'  : (lOut === 'PASS' ? 'Unilateral Pass' : 'Inconclusive');
  if (rightTested) return rOut === 'REFER' ? 'Right Ear Refer' : (rOut === 'PASS' ? 'Unilateral Pass' : 'Inconclusive');
  return 'Inconclusive';
};

const classifyOAE = row => {
  if (row.oaeLeft === 'PASS' && row.oaeRight === 'PASS') return 'PASS';
  if (row.oaeLeft === 'PASS' || row.oaeRight === 'PASS') return 'Unilateral Pass';
  if (row.oaeLeft === 'REFER' || row.oaeRight === 'REFER') return 'REFER';
  return 'Inconclusive';
};

// count non-empty dB-ear slots (PASS, REFER, or REDO)
const countAttemptedSlots = row => {
  const allSlots = [...row.leftEar, ...row.rightEar];
  return allSlots.filter(v => v === 'PASS' || v === 'REFER' || v === 'REDO').length;
};

const countRedoSlots = row => {
  const allSlots = [...row.leftEar, ...row.rightEar];
  return allSlots.filter(v => v === 'REDO').length;
};

const screeningDurationMins = row => {
  if (!row.testStart || !row.submitTime) return null;
  const start = new Date(row.testStart);
  const end   = new Date(row.submitTime);
  if (isNaN(start) || isNaN(end)) return null;
  const diff = (end - start) / 60000;
  return diff > 0 && diff < 120 ? diff : null; // ignore negative or >2hr outliers
};

const pct = (n,d) => d>0 ? Math.round((n/d)*100) : 0;
const fmtDate = d => (!d||isNaN(d)) ? 'N/A' : d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const fmtMins = m => m === null ? 'N/A' : `${m.toFixed(1)} min`;
const toInputDate = d => { const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const monthStart = () => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; };
const todayEnd = () => { const d = new Date(); d.setHours(23,59,59,999); return d; };

const calcStats = rows => {
  const aabr = rows.filter(r => r.testType === 'AABR');
  const oae  = rows.filter(r => r.testType === 'OAE');
  const aabrR = aabr.map(classifyAABR);
  const oaeR  = oae.map(classifyOAE);

  const rfCounts = {}, recCounts = {};
  rows.forEach(r => {
    RF_LIST.forEach(rf => { if (r.riskFactors.includes(rf)) rfCounts[rf] = (rfCounts[rf]||0)+1; });
    if (r.cleanRec) recCounts[r.cleanRec] = (recCounts[r.cleanRec]||0)+1;
  });

  const dates = rows.map(r => r.ts).filter(d => !isNaN(d)).sort((a,b) => a-b);

  const hospMap={}, ngoMap={}, deviceMap={}, workerMap={};
  rows.forEach(r => {
    if (r.hospital) { if (!hospMap[r.hospital])   hospMap[r.hospital]   = {count:0,rows:[]}; hospMap[r.hospital].count++;   hospMap[r.hospital].rows.push(r); }
    if (r.ngo)      { if (!ngoMap[r.ngo])         ngoMap[r.ngo]         = {count:0,rows:[]}; ngoMap[r.ngo].count++;         ngoMap[r.ngo].rows.push(r); }
    if (r.device)   { if (!deviceMap[r.device])   deviceMap[r.device]   = {count:0,rows:[]}; deviceMap[r.device].count++;   deviceMap[r.device].rows.push(r); }
    if (r.opId)     { if (!workerMap[r.opId])     workerMap[r.opId]     = {name:r.opName||r.opId,count:0,rows:[]}; workerMap[r.opId].count++; workerMap[r.opId].rows.push(r); }
  });

  // AABR outcome counts
  const aabrPass      = aabrR.filter(r => r === 'PASS').length;
  const aabrUniPass   = aabrR.filter(r => r === 'Unilateral Pass').length;
  const aabrRefer     = aabrR.filter(r => r === 'Left Ear Refer' || r === 'Right Ear Refer' || r === 'Bilateral Refer').length;
  const bilat         = aabrR.filter(r => r === 'Bilateral Refer').length;
  const leftOnly      = aabrR.filter(r => r === 'Left Ear Refer').length;
  const rightOnly     = aabrR.filter(r => r === 'Right Ear Refer').length;
  const aabrInconc    = aabrR.filter(r => r === 'Inconclusive').length;

  // OAE outcome counts
  const oaePass       = oaeR.filter(r => r === 'PASS').length;
  const oaeUniPass    = oaeR.filter(r => r === 'Unilateral Pass').length;
  const oaeRefer      = oaeR.filter(r => r === 'REFER').length;

  // Gestational age
  const preterm = rows.filter(r => r.gestAge > 0 && r.gestAge < 37).length;
  const term    = rows.filter(r => r.gestAge >= 37).length;
  const dpoae   = oae.filter(r => r.oaeTestType === 'DPOAE').length;
  const teoae   = oae.filter(r => r.oaeTestType === 'TEOAE').length;

  // REDO rate: REDO slots / total attempted slots across AABR rows
  let totalAttempted = 0, totalRedo = 0;
  aabr.forEach(r => { totalAttempted += countAttemptedSlots(r); totalRedo += countRedoSlots(r); });
  const redoRate = totalAttempted > 0 ? Math.round((totalRedo / totalAttempted) * 100) : 0;
  const redoRateRaw = totalAttempted > 0 ? (totalRedo / totalAttempted) * 100 : 0;

  // Avg OAE time: raw duration per row
  const oaeTimes = oae.map(screeningDurationMins).filter(t => t !== null);
  const avgOaeTime = oaeTimes.length > 0 ? oaeTimes.reduce((a,b) => a+b, 0) / oaeTimes.length : null;

  // Avg AABR time per dB-ear unit
  let totalAabrDuration = 0, totalAabrSlots = 0;
  aabr.forEach(r => {
    const dur = screeningDurationMins(r);
    const slots = countAttemptedSlots(r);
    if (dur !== null && slots > 0) { totalAabrDuration += dur; totalAabrSlots += slots; }
  });
  const avgAabrTimePerUnit = totalAabrSlots > 0 ? totalAabrDuration / totalAabrSlots : null;

  // Protocol overrides
  const protocolOverrides = rows.filter(r => r.rec && r.rec.toLowerCase().includes('healthcare worker chose to test only')).length;
  const overridesPer100 = rows.length >= 100 ? Math.round((protocolOverrides / rows.length) * 100) : null;

  return {
    total: rows.length,
    uniqueBabies: new Set(rows.map(r => r.babyId)).size,
    firstDate: dates[0]||null, lastDate: dates[dates.length-1]||null,
    aabrTotal: aabr.length, aabrPass, aabrUniPass, aabrRefer, bilat, leftOnly, rightOnly, aabrInconc,
    oaeTotal: oae.length, oaePass, oaeUniPass, oaeRefer, dpoae, teoae,
    rfCounts, recCounts, preterm, term,
    workerMap, hospMap, deviceMap, ngoMap,
    uniqueHospitals: Object.keys(hospMap).length,
    uniqueWorkers:   Object.keys(workerMap).length,
    redoRate, redoRateRaw, totalRedo, totalAttempted,
    avgOaeTime, avgAabrTimePerUnit,
    protocolOverrides, overridesPer100,
  };
};

// ── DESIGN TOKENS ──────────────────────────────────────────────────────────────
const C = {
  primary:'#202B5D', primaryLight:'#2d3d80', blue100:'#dbeafe', blue700:'#1d4ed8',
  green50:'#f0fdf4', green100:'#dcfce7', green600:'#16a34a', green700:'#15803d',
  orange50:'#fff7ed', orange100:'#ffedd5', orange500:'#f97316', orange600:'#ea580c',
  red50:'#fef2f2', red600:'#dc2626', red700:'#b91c1c',
  yellow50:'#fefce8', yellow500:'#eab308', yellow600:'#ca8a04',
  slate50:'#f8fafc', slate100:'#f1f5f9', slate200:'#e2e8f0',
  slate400:'#94a3b8', slate500:'#64748b', slate600:'#475569', slate700:'#334155', slate800:'#1e293b',
};

// ── BASE COMPONENTS ────────────────────────────────────────────────────────────
const Card = ({children, style={}, onClick}) => h('div',{
  onClick, style:{background:'#fff',borderRadius:14,border:`1px solid ${C.slate200}`,
    boxShadow:'0 1px 3px rgba(0,0,0,0.06)',padding:16,
    cursor:onClick?'pointer':'default',...style}
}, children);

const SectionLabel = ({children}) => h('div',{style:{
  fontSize:10,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',
  color:C.slate400,marginBottom:10
}}, children);

const BarRow = ({label,value,total,color,suffix}) => {
  const p = pct(value,total);
  return h('div',{style:{marginBottom:12}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}},
      h('span',{style:{fontSize:13,color:C.slate600}}, label),
      h('span',{style:{fontSize:13,fontWeight:600,color:C.slate800}}, suffix||`${value} (${p}%)`)
    ),
    h('div',{style:{background:C.slate200,borderRadius:999,height:7}},
      h('div',{style:{background:color,borderRadius:999,height:7,width:`${p}%`,transition:'width 0.5s ease'}})
    )
  );
};

const Chip = ({label,bg,fg}) => h('span',{style:{
  display:'inline-flex',alignItems:'center',padding:'3px 10px',borderRadius:999,
  fontSize:11,fontWeight:600,background:bg,color:fg,marginRight:5,marginBottom:5
}}, label);

const StatBox = ({value,label,color}) => h('div',{style:{
  flex:1,background:'#fff',borderRadius:14,border:`1px solid ${C.slate200}`,
  padding:'14px 8px',textAlign:'center',boxShadow:'0 1px 3px rgba(0,0,0,0.05)'
}},
  h('div',{style:{fontSize:26,fontWeight:700,color:color||C.primary}}, String(value)),
  h('div',{style:{fontSize:11,color:C.slate400,marginTop:3,lineHeight:'1.3'}}, label)
);

const BackBtn = ({onClick}) => h('button',{onClick,style:{
  display:'flex',alignItems:'center',gap:6,background:'none',border:'none',
  color:C.slate500,fontSize:13,fontWeight:500,cursor:'pointer',padding:'6px 0',marginBottom:8
}},
  h('svg',{xmlns:'http://www.w3.org/2000/svg',width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
    h('path',{d:'m15 18-6-6 6-6'})
  ),
  'Back'
);

const Divider = () => h('div',{style:{borderTop:`1px solid ${C.slate200}`,margin:'12px 0'}});

// ── GAUGE COMPONENT ────────────────────────────────────────────────────────────
// Semi-circle gauge. value 0-100. color zones configurable.
const Gauge = ({value, max=100, label, color, size=120}) => {
  const r = 42, cx = 60, cy = 56;
  const circumference = Math.PI * r; // half circle
  const pctVal = Math.min(Math.max(value/max,0),1);
  const offset = circumference * (1 - pctVal);
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center'}},
    h('svg',{width:size,height:size*0.6,viewBox:'0 0 120 70'},
      // background arc
      h('path',{
        d:`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`,
        fill:'none',stroke:C.slate200,strokeWidth:10,strokeLinecap:'round'
      }),
      // value arc
      h('path',{
        d:`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`,
        fill:'none',stroke:color,strokeWidth:10,strokeLinecap:'round',
        strokeDasharray:`${circumference}`,
        strokeDashoffset:`${offset}`,
        style:{transition:'stroke-dashoffset 0.6s ease'}
      }),
      h('text',{x:cx,y:cy-4,textAnchor:'middle',fontSize:18,fontWeight:700,fill:C.slate800}, `${Math.round(value)}${max===100?'%':''}`),
      h('text',{x:cx,y:cy+12,textAnchor:'middle',fontSize:9,fill:C.slate400}, label)
    )
  );
};

// ── DONUT COMPONENT ────────────────────────────────────────────────────────────
const Donut = ({segments, label, total, size=110}) => {
  // segments: [{value, color, label}]
  const r = 38, cx = 55, cy = 55;
  const circ = 2 * Math.PI * r;
  let cumAngle = -Math.PI / 2;
  const paths = segments.filter(s => s.value > 0).map((seg, i) => {
    const angle = (seg.value / total) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(cumAngle);
    const y1 = cy + r * Math.sin(cumAngle);
    cumAngle += angle;
    const x2 = cx + r * Math.cos(cumAngle);
    const y2 = cy + r * Math.sin(cumAngle);
    const largeArc = angle > Math.PI ? 1 : 0;
    return h('path',{
      key:i,
      d:`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`,
      fill:seg.color, opacity:0.9
    });
  });
  return h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center'}},
    h('svg',{width:size,height:size,viewBox:`0 0 110 110`},
      h('circle',{cx,cy,r,fill:'white',stroke:C.slate200,strokeWidth:1}),
      ...paths,
      h('circle',{cx,cy,r:22,fill:'white'}),
      h('text',{x:cx,y:cy-4,textAnchor:'middle',fontSize:14,fontWeight:700,fill:C.slate800},String(total)),
      h('text',{x:cx,y:cy+10,textAnchor:'middle',fontSize:8,fill:C.slate400},label)
    )
  );
};

// ── MINI STAT TILE ─────────────────────────────────────────────────────────────
const MiniTile = ({value,label,sub,bg,fg,fgSub}) => h('div',{style:{
  flex:1,background:bg||'#fff',borderRadius:12,border:`1px solid ${C.slate200}`,
  padding:'12px 8px',textAlign:'center'
}},
  h('div',{style:{fontSize:22,fontWeight:700,color:fg||C.primary}},String(value)),
  h('div',{style:{fontSize:11,color:fg||C.slate500,marginTop:2,lineHeight:'1.3',fontWeight:600}},label),
  sub && h('div',{style:{fontSize:10,color:fgSub||C.slate400,marginTop:1}},sub)
);

// ── RECCOLOR HELPER ────────────────────────────────────────────────────────────
const recColor = rec => {
  if (!rec) return C.slate400;
  if (rec.includes('No Action')||rec.includes('Pass - No')) return C.green600;
  if (rec.includes('BERA')||rec.includes('audiologist')||rec.includes('Refer')) return C.red600;
  if (rec.includes('Rescreen')||rec.includes('Repeat')||rec.includes('Follow Up')) return C.yellow600;
  return C.slate400;
};

// ── EFFICIENCY CARD ────────────────────────────────────────────────────────────
const EfficiencyCard = ({s, showOverrides=false}) => {
  const hasTime = s.avgAabrTimePerUnit !== null || s.avgOaeTime !== null;
  return h(Card,{style:{marginBottom:12}},
    h(SectionLabel,{}, 'Screening Efficiency'),
    h('div',{style:{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap'}},
      s.avgAabrTimePerUnit !== null && h(MiniTile,{
        value:s.avgAabrTimePerUnit.toFixed(1),
        label:'min / AABR unit',
        sub:'per dB-ear slot',
        bg:C.blue100, fg:C.blue700
      }),
      s.avgOaeTime !== null && h(MiniTile,{
        value:s.avgOaeTime.toFixed(1),
        label:'min / OAE screen',
        sub:'end-to-end',
        bg:C.green50, fg:C.green700
      })
    ),
    s.totalAttempted > 0 && h('div',{style:{marginBottom:12}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
        h('span',{style:{fontSize:13,color:C.slate600}}, 'AABR REDO Rate'),
        h('span',{style:{fontSize:13,fontWeight:700,color: s.redoRate>20?C.red600:s.redoRate>10?C.yellow600:C.green600}}, `${s.redoRate}%`)
      ),
      h(Gauge,{value:s.redoRate,max:100,label:'REDO rate',
        color:s.redoRate>20?C.red600:s.redoRate>10?C.yellow600:C.green600,size:130})
    ),
    showOverrides && h('div',{},
      h(Divider),
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('div',{},
          h('div',{style:{fontSize:13,fontWeight:600,color:C.slate800}}, `${s.protocolOverrides} protocol overrides`),
          h('div',{style:{fontSize:11,color:C.slate400,marginTop:2}}, 'Worker tested one ear only')
        ),
        s.overridesPer100 !== null
          ? h('span',{style:{padding:'3px 10px',borderRadius:999,fontSize:12,fontWeight:700,
              background:s.overridesPer100>10?C.red50:C.yellow50,
              color:s.overridesPer100>10?C.red700:C.yellow600}},
              `${s.overridesPer100} per 100`)
          : h('span',{style:{fontSize:11,color:C.slate400}}, s.total < 100 ? `(${s.total}/100 screenings)` : '')
      )
    )
  );
};

// ── LOADING SCREEN ─────────────────────────────────────────────────────────────
const LoadingScreen = () =>
  h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:C.slate100,gap:20}},
    h('div',{className:'spinner'}),
    h('div',{style:{fontSize:14,color:C.slate500,fontWeight:500}}, 'Loading screening data...'),
    h('div',{style:{fontSize:12,color:C.slate400}}, 'Connecting to live data source')
  );

// ── ERROR SCREEN ───────────────────────────────────────────────────────────────
const ErrorScreen = ({message, onRetry}) =>
  h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:C.slate100,padding:24,gap:16}},
    h('div',{style:{width:52,height:52,borderRadius:'50%',background:C.red50,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24}}, '!'),
    h('div',{style:{fontSize:16,fontWeight:600,color:C.slate800,textAlign:'center'}}, 'Could not load data'),
    h('div',{style:{fontSize:13,color:C.slate500,textAlign:'center',maxWidth:300,lineHeight:'1.5'}}, message),
    h('button',{onClick:onRetry,
      style:{background:C.primary,color:'#fff',border:'none',borderRadius:12,padding:'12px 28px',fontSize:14,fontWeight:600,cursor:'pointer',marginTop:8}
    }, 'Retry')
  );

// ── LOGIN SCREEN ───────────────────────────────────────────────────────────────
const LoginScreen = ({onLogin, dataTimestamp, credsFallback}) => {
  const [form, setForm] = useState({u:'',p:''});
  const [err, setErr] = useState('');

  const attempt = () => {
    const user = onLogin(form.u, form.p);
    if (!user) setErr('Invalid username or password.');
  };

  return h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',background:C.slate100}},
    h('div',{style:{background:C.primary,color:'#fff',padding:'56px 24px 32px',borderBottomLeftRadius:28,borderBottomRightRadius:28,boxShadow:'0 4px 20px rgba(32,43,93,0.25)'}},

// ── DATE RANGE CARD ────────────────────────────────────────────────────────────
const PRESETS = [
  { label: 'This month',   getRange: () => ({ from: monthStart(), to: todayEnd() }) },
  { label: 'Last 30 days', getRange: () => { const to = todayEnd(); const from = new Date(to); from.setDate(from.getDate()-29); from.setHours(0,0,0,0); return { from, to }; } },
  { label: 'All time',     getRange: () => ({ from: new Date('2000-01-01'), to: todayEnd() }) },
];

const DateRangeCard = ({dateFrom, dateTo, setDateFrom, setDateTo, activePreset, setActivePreset}) => {
  return h(Card, {style:{marginBottom:12}},
    h(SectionLabel, {}, 'Date Range'),
    h('div', {style:{display:'flex',gap:6,marginBottom:12}},
      PRESETS.map((p) =>
        h('button', {
          key: p.label,
          onClick: () => { const r = p.getRange(); setDateFrom(r.from); setDateTo(r.to); setActivePreset(p.label); },
          style: {
            flex:1, padding:'6px 0', borderRadius:8, border:'none', cursor:'pointer',
            fontSize:11, fontWeight:600,
            background: activePreset===p.label ? C.primary : C.slate100,

    h('div', {style:{display:'flex',gap:8,alignItems:'center'}},
      h('div', {style:{flex:1}},
        h('label', {style:{fontSize:11,color:C.slate400,display:'block',marginBottom:4}}, 'From'),
        h('input', {
          type:'date', value:toInputDate(dateFrom),
          onChange: e => { const d = new Date(e.target.value); d.setHours(0,0,0,0); setDateFrom(d); setActivePreset(null); },

// ── DRILL LIST SCREEN ──────────────────────────────────────────────────────────
const DrillListScreen = ({user, type, rows, onSelect, onBack}) => {
  const labels = {hospital:'Hospital',device:'Device',ngo:'NGO / CSR Partner',worker:'Healthcare Worker'};
  const entityMap = {};
  rows.forEach(r => {
    const key = type==='hospital'?r.hospital : type==='device'?r.device : type==='ngo'?r.ngo : r.opId;
    if (!key) return;
    if (!entityMap[key]) entityMap[key] = {label:key,displayName:'',count:0,rows:[]};
    if (type==='worker' && !entityMap[key].displayName) entityMap[key].displayName = r.opName||r.opId;
    entityMap[key].count++;
    entityMap[key].rows.push(r);
  });

  const sorted = Object.entries(entityMap).sort((a,b) => b[1].count - a[1].count);

  return h('div',{style:{minHeight:'100vh',paddingBottom:60}},
    h('div',{style:{background:C.primary,color:'#fff',padding:'56px 24px 28px',borderBottomLeftRadius:28,borderBottomRightRadius:28,boxShadow:'0 4px 20px rgba(32,43,93,0.25)'}},
      h('div',{style:{fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:'#93c5fd',marginBottom:6}}, 'Drill Down'),
      h('h1',{style:{fontSize:22,fontWeight:700,margin:0}}, `By ${labels[type]}`)
    ),
    h('div',{style:{padding:'16px 14px'}},
      h(BackBtn,{onClick:onBack}),
      sorted.map(([key,info]) => {
        const s = calcStats(info.rows);
        const totalRefer = s.aabrRefer + s.oaeRefer;
        const totalTests = s.aabrTotal + s.oaeTotal;
        const referPct   = pct(totalRefer, totalTests);
        const redoPct    = s.redoRate;
        return h(Card,{key, style:{marginBottom:10,cursor:'pointer'}, onClick:()=>onSelect(type,key,info.rows)},
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
            h('div',{style:{flex:1,marginRight:12}},
              h('div',{style:{fontSize:14,fontWeight:600,color:C.slate800}},
                type==='worker' ? (info.displayName||key) : key
              ),
              type==='worker' && h('div',{style:{fontSize:11,color:C.slate400,marginTop:2}}, `ID: ${key}`),
              type==='worker' && info.rows[0]&&info.rows[0].ngo && h('div',{style:{fontSize:11,color:C.slate400}}, info.rows[0].ngo)
            ),
            h('div',{style:{textAlign:'right'}},
              h('div',{style:{fontSize:22,fontWeight:700,color:C.primary}}, info.count),
              h('div',{style:{fontSize:11,color:C.slate400}}, 'screenings'),
              (type==='ngo'||type==='hospital') && referPct>0 && h('span',{style:{display:'inline-block',marginTop:4,padding:'2px 8px',borderRadius:999,fontSize:11,fontWeight:600,background:C.red50,color:C.red700}}, `${referPct}% refer`)
            )
          ),
          h('div',{style:{display:'flex',flexWrap:'wrap',marginTop:10}},
            (type==='worker'||type==='device')
              ? s.redoRate>0 && h(Chip,{label:`REDO: ${redoPct}%`,bg:C.yellow50,fg:C.yellow600})
              : h(Chip,{label:`Refer: ${referPct}%`,bg:C.red50,fg:C.red700}),
            (type==='ngo'||type==='hospital') && s.preterm>0 && h(Chip,{label:`Preterm: ${pct(s.preterm,s.total)}%`,bg:C.orange50,fg:C.orange600})
          )
        );
      })
    )
  );
};

        h('div',{style:{display:'flex',flexWrap:'wrap'}},
          h(Chip,{label:`Bilateral: ${s.bilat}`,      bg:C.red50,    fg:C.red700}),
          h(Chip,{label:`Left only: ${s.leftOnly}`,   bg:C.orange50, fg:C.orange600}),
          h(Chip,{label:`Right only: ${s.rightOnly}`, bg:C.yellow50, fg:C.yellow600})
        )
      ),

      s.oaeTotal>0 && h(Card,{style:{marginBottom:12}},
        h(SectionLabel,{}, `OAE Results  ·  ${s.oaeTotal} screenings${s.dpoae>0?'  ·  DPOAE: '+s.dpoae:''}${s.teoae>0?'  ·  TEOAE: '+s.teoae:''}`),
        h('div',{style:{display:'flex',justifyContent:'space-around',alignItems:'flex-start',marginBottom:4}},
          h(Donut,{segments:oaeSegments, label:'OAE', total:s.oaeTotal, size:110}),
          h('div',{style:{display:'flex',flexDirection:'column',justifyContent:'center',gap:6,paddingTop:8}},
            h('div',{style:{display:'flex',alignItems:'center',gap:6}}, h('div',{style:{width:10,height:10,borderRadius:2,background:C.green600}}), h('span',{style:{fontSize:12,fontWeight:600,color:C.slate800}},'Pass: '+s.oaePass)),
            s.oaeUniPass>0 && h('div',{style:{display:'flex',alignItems:'center',gap:6}}, h('div',{style:{width:10,height:10,borderRadius:2,background:'#86efac'}}), h('span',{style:{fontSize:12,fontWeight:600,color:C.slate800}},'Uni Pass: '+s.oaeUniPass)),
            h('div',{style:{display:'flex',alignItems:'center',gap:6}}, h('div',{style:{width:10,height:10,borderRadius:2,background:C.red600}}), h('span',{style:{fontSize:12,fontWeight:600,color:C.slate800}},'Refer: '+s.oaeRefer))
          )
        )
      ),

      h(Card,{style:{marginBottom:12}},
        h(SectionLabel,{}, 'Gestational Age Profile'),
        h('div',{style:{display:'flex',gap:10}},
          h('div',{style:{flex:1,background:C.orange50,borderRadius:12,padding:'12px 8px',textAlign:'center'}},
            h('div',{style:{fontSize:22,fontWeight:700,color:C.orange600}},s.preterm),
            h('div',{style:{fontSize:11,color:C.orange500,marginTop:2}},'Preterm (<37w)'),
            h('div',{style:{fontSize:11,color:C.slate400}},`${pct(s.preterm,s.total)}%`)
          ),
          h('div',{style:{flex:1,background:C.green50,borderRadius:12,padding:'12px 8px',textAlign:'center'}},
            h('div',{style:{fontSize:22,fontWeight:700,color:C.green600}},s.term),
            h('div',{style:{fontSize:11,color:C.green700,marginTop:2}},'Term (≥37w)'),
            h('div',{style:{fontSize:11,color:C.slate400}},`${pct(s.term,s.total)}%`)
          )
        )
      ),

      Object.keys(s.rfCounts).length>0 && h(Card,{style:{marginBottom:12}},
        h(SectionLabel,{}, 'Risk Factors'),
        (() => {
          const rfTotal = Object.values(s.rfCounts).reduce((a,b)=>a+b,0);
          return Object.entries(s.rfCounts).sort((a,b)=>b[1]-a[1]).map(([rf,count]) =>
            h(BarRow,{key:rf,label:rf,value:count,total:rfTotal,color:'#d97706'})
          );
        })()
      ),

      Object.keys(s.recCounts).length>0 && h(Card,{style:{marginBottom:12}},
        h(SectionLabel,{}, 'Outcome Breakdown'),
        Object.entries(s.recCounts).sort((a,b)=>b[1]-a[1]).map(([rec,count]) =>
          h(BarRow,{key:rec,label:rec,value:count,total:s.total,color:recColor(rec)})
        )
      ),

      type==='worker' && (() => {
        const hospSet = [...new Set(rows.map(r=>r.hospital).filter(Boolean))];
        return hospSet.length>0 && h(Card,{style:{marginBottom:12}},
          h(SectionLabel,{}, 'Hospitals Visited'),
          h('div',{style:{display:'flex',flexWrap:'wrap'}},
            hospSet.map(hh => h(Chip,{key:hh,label:hh,bg:C.slate100,fg:C.slate600}))
          )
        );
      })(),

      type==='device' && (() => {
        const workerTally = {};
        rows.forEach(r => {
          if (!r.opId) return;
          if (!workerTally[r.opId]) workerTally[r.opId] = {name:r.opName||r.opId,count:0};
          workerTally[r.opId].count++;
        });
        const ranked = Object.entries(workerTally).sort((a,b) => b[1].count - a[1].count);
        return ranked.length>0 && h(Card,{style:{marginBottom:12}},
          h(SectionLabel,{}, 'Healthcare Workers Using This Device'),
          ranked.map(([opId,info]) =>
            h('div',{key:opId, style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
              h('div',{},
                h('div',{style:{fontSize:13,fontWeight:600,color:C.slate800}}, info.name),
                h('div',{style:{fontSize:11,color:C.slate400}}, `ID: ${opId}`)
              ),
              h('div',{style:{fontSize:13,fontWeight:600,color:C.primary}}, `${info.count} screenings`)
            )
          )
        );
      })()
    )
  );
};

// ── APP ────────────────────────────────────────────────────────────────────────
const App = () => {
  const [loadState, setLoadState]   = useState('loading');
  const [errorMsg,  setErrorMsg]    = useState('');
  const [rawRows,   setRawRows]     = useState([]);
  const [dataTimestamp, setDataTimestamp] = useState('');
  const [users,     setUsers]       = useState([]);
  const [credsFallback, setCredsFallback] = useState(false);
  const [user,      setUser]        = useState(null);
  const [screen,    setScreen]      = useState('login');
  const [drillType, setDrillType]   = useState(null);
  const [entityKey, setEntityKey]   = useState(null);
  const [entityRows,setEntityRows]  = useState([]);
  const [dateFrom,  setDateFrom]    = useState(monthStart());
  const [dateTo,    setDateTo]      = useState(todayEnd());
  const [activePreset, setActivePreset] = useState('This month');

  // fetch live credentials from Admin Credentials sheet
  const fetchCreds = async () => {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${CREDS_SHEET_ID}/export?format=csv&gid=0`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Could not fetch credentials sheet');
      const text = await res.text();
      const lines = text.trim().split('\n').slice(1); // skip header row
      const parsed = lines.map(line => {
        const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g,''));
        const username = cols[0]||'';
        const password = cols[1]||'';
        const name     = cols[2]||username;
        const notes    = cols[3]||'';
        const isAdmin  = notes.toLowerCase().includes('full access');
        return { username, password, name, role: isAdmin?'admin':'ngo', ngo: isAdmin?null:notes };
      }).filter(u => u.username && u.password);
      if (parsed.length === 0) throw new Error('Empty credentials sheet');
      setUsers(parsed);
      setCredsFallback(false);
    } catch (e) {
      console.warn('Credentials fetch failed, using fallback:', e.message);
      setUsers(FALLBACK_USERS);
      setCredsFallback(true);
    }
  };

  const fetchData = () => {
    setLoadState('loading');
    setErrorMsg('');
    fetch(`${SCRIPT_URL}?action=getAll`)
      .then(res => { if (!res.ok) throw new Error(`Server responded with status ${res.status}`); return res.json(); })
      .then(json => {
        if (json.status !== 'success') throw new Error(json.message || 'Unexpected response from data source');
        setRawRows(Array.isArray(json.data) ? json.data.slice(1) : []);
        setDataTimestamp(new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}));
        setLoadState('ready');
      })
      .catch(err => { setErrorMsg(`${err.message}. Please check your connection and try again.`); setLoadState('error'); });
  };

  useEffect(() => {
    fetchCreds();
    fetchData();
  }, []);

  const Watermark = () => h('div',{style:{position:'fixed',bottom:12,left:'50%',transform:'translateX(-50%)',background:'rgba(32,43,93,0.15)',color:C.slate500,fontSize:10,padding:'3px 12px',borderRadius:999,fontFamily:'monospace',whiteSpace:'nowrap',pointerEvents:'none',zIndex:9999}},
    `Sohum Dashboard · v${DASHBOARD_VERSION}`
  );

  if (loadState === 'loading') return h(React.Fragment,null, h(LoadingScreen), h(Watermark));
  if (loadState === 'error')   return h(React.Fragment,null, h(ErrorScreen,{message:errorMsg,onRetry:fetchData}), h(Watermark));

  const handleLogin = (username, password) => {
    const found = users.find(u => u.username === username && u.password === password);
    if (found) { setUser(found); setScreen('overview'); }
    return found || null;
  };

  const allRows = user ? parseRows(rawRows, user.ngo) : [];
  const rows    = allRows.filter(r => r.ts >= dateFrom && r.ts <= dateTo);

  return h(React.Fragment,null,
    h(Watermark),
    !user ? h(LoginScreen,{dataTimestamp, credsFallback, onLogin: handleLogin}) :
    screen==='overview' ? h(OverviewScreen,{
      user, rows, dataTimestamp,
      dateFrom, dateTo, setDateFrom, setDateTo, activePreset, setActivePreset,
      onLogout: ()=>{ setUser(null); setScreen('login'); },
      onDrill:  type=>{ setDrillType(type); setScreen('drill'); }
    }) :
    screen==='drill' ? h(DrillListScreen,{
      user, type:drillType, rows,
      onBack:   ()=>setScreen('overview'),
      onSelect: (type,key,erows)=>{ setDrillType(type); setEntityKey(key); setEntityRows(erows); setScreen('detail'); }
    }) :
    screen==='detail' ? h(EntityDetailScreen,{
      type:drillType, entityKey, rows:entityRows,
      onBack: ()=>setScreen('drill')
    }) : null
  );
};

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
